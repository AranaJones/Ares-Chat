name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ares-ai-chat-desktop
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ares-ai-chat-${{ github.ref_name }}-windows-installer
          path: ares-ai-chat-desktop/dist/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ares-ai-chat-desktop/dist/*.exe
          fail_on_unmatched_files: true
