<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ares Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="chat-card" aria-label="Ares chat application">
      <header class="chat-header">
        <div>
          <p class="eyebrow">Ares Assistant</p>
          <h1>Ares Chat</h1>
          <p class="subtitle">A browser-ready conversation demo with local history.</p>
        </div>

        <div class="header-actions">
          <button type="button" class="secondary-btn" id="profileBtn">Profile</button>
          <button type="button" class="danger-btn" id="resetBtn">Clear chat</button>
        </div>
      </header>

      <section class="chat-meta" aria-label="Conversation details">
        <div class="participant participant-user">
          <div class="avatar" id="userAvatar" aria-hidden="true">Y</div>
          <div>
            <strong id="userNameDisplay">You</strong>
            <p>Messages are saved on this device.</p>
          </div>
        </div>
        <div class="participant participant-ai">
          <div class="avatar ai-avatar" aria-hidden="true">AI</div>
          <div>
            <strong>Ares</strong>
            <p id="conversationStatus">Ready to help.</p>
          </div>
        </div>
      </section>

      <section class="chat-history" id="chatHistory" aria-live="polite" aria-label="Conversation history"></section>

      <form class="composer" id="chatForm">
        <label class="sr-only" for="messageInput">Message</label>
        <textarea
          id="messageInput"
          rows="1"
          maxlength="1000"
          placeholder="Type your message to Ares..."
        ></textarea>
        <div class="composer-actions">
          <p class="helper-text">Press Enter to send, Shift + Enter for a new line.</p>
          <button type="submit" class="primary-btn" id="sendBtn">Send</button>
        </div>
      </form>
    </section>
  </main>

  <dialog class="profile-dialog" id="profileDialog">
    <form method="dialog" class="dialog-content" id="profileForm">
      <div class="dialog-header">
        <h2>Edit profile</h2>
        <button type="button" class="icon-btn" id="closeProfileBtn" aria-label="Close profile dialog">×</button>
      </div>

      <label class="dialog-label" for="userNameInput">Display name</label>
      <input id="userNameInput" name="name" type="text" maxlength="24" placeholder="Enter your name" />

      <label class="dialog-label" for="userAvatarInput">Avatar text</label>
      <input id="userAvatarInput" name="avatar" type="text" maxlength="2" placeholder="e.g. AJ" />

      <p class="dialog-note">These details are stored locally in your browser.</p>

      <div class="dialog-actions">
        <button type="button" class="secondary-btn" id="cancelProfileBtn">Cancel</button>
        <button type="submit" class="primary-btn">Save profile</button>
      </div>
    </form>
  </dialog>

  <template id="messageTemplate">
    <article class="message">
      <div class="avatar message-avatar" aria-hidden="true"></div>
      <div class="message-body">
        <div class="message-topline">
          <span class="message-author"></span>
          <time class="message-time"></time>
        </div>
        <p class="message-text"></p>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
