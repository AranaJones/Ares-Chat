name: Build Windows installer

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ares-ai-chat-desktop
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist:win -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ares-ai-chat-windows-installer
          path: ares-ai-chat-desktop/dist/Ares.AI.Chat.Setup.*.exe

      - name: Publish installer to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ares-ai-chat-desktop/dist/Ares.AI.Chat.Setup.*.exe
          fail_on_unmatched_files: true
