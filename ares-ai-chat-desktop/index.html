<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ares Chat</title>
<style>
  :root {
    --ares-username-color: #3498db;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 10px;
    height: 100vh;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  .container {
    display: flex;
    height: 100%;
    gap: 10px;
  }

  .sidebar {
    width: 170px;
    background: #2c3e50;
    color: white;
    border-radius: 5px;
    overflow-y: auto;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 10px;
    font-weight: bold;
    border-bottom: 1px solid #34495e;
    margin-bottom: 5px;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.6px;
    color: #bdc3c7;
  }

  .channel-item {
    padding: 8px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
  }

  .channel-item:hover {
    background: #34495e;
  }

  .channel-item.active {
    background: #3498db;
    border-left-color: #fff;
    font-weight: bold;
  }

  .channel-item.browse {
    background: linear-gradient(180deg, #47335f, #2f2748);
    border-top: 1px solid rgba(255,255,255,0.12);
    border-bottom: 1px solid rgba(0,0,0,0.35);
    color: #f5d7ff;
  }

  .channel-item.browse.active {
    background: linear-gradient(180deg, #7d44ba, #5a2d8a);
    color: #fff;
  }

  #channelList {
    flex: 1;
    overflow-y: auto;
  }

  .sidebar-footer {
    padding: 10px;
    border-top: 1px solid #34495e;
    margin-top: auto;
  }

  .settings-btn {
    width: 100%;
    padding: 8px;
    background: #34495e;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    transition: background 0.2s;
  }

  .settings-btn:hover {
    background: #2c3e50;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: white;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .header {
    background: #2c3e50;
    color: white;
    padding: 12px 15px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .brand-logo {
    width: clamp(22px, 2.2vw, 30px);
    height: clamp(22px, 2.2vw, 30px);
    max-width: 100%;
    object-fit: contain;
    flex: 0 0 auto;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }

  .header h2 {
    margin: 0;
    font-size: clamp(15px, 1.4vw, 16px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header .username {
    font-size: 12px;
    color: var(--ares-username-color);
    white-space: nowrap;
    flex: 0 0 auto;
    text-shadow: 0 0 1px rgba(255,255,255,0.45), 0 0 1px rgba(0,0,0,0.45);
  }

  .chat-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .chatlog {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #fafafa;
  }

  .message {
    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 3px;
    background: white;
    border-left: 3px solid #3498db;
  }

  .message.system {
    border-left-color: #95a5a6;
    color: #7f8c8d;
    font-style: italic;
    background: #ecf0f1;
  }

  .message.update {
    border-left-color: #27ae60;
    color: #27ae60;
    background: #d5f4e6;
    font-weight: bold;
  }

  .message-user {
    font-weight: bold;
    color: var(--ares-username-color);
    text-shadow: 0 0 1px rgba(255,255,255,0.45), 0 0 1px rgba(0,0,0,0.35);
  }

  .system-user-ref {
    color: var(--ares-username-color);
    font-weight: bold;
    text-shadow: 0 0 1px rgba(255,255,255,0.45), 0 0 1px rgba(0,0,0,0.35);
  }

  .message-time {
    font-size: 12px;
    color: #95a5a6;
    margin-right: 8px;
  }

  .message-text {
    color: #333;
    word-wrap: break-word;
  }

  .message.update .message-text {
    color: inherit;
  }

  .inputbar {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: white;
    border-top: 1px solid #ddd;
  }

  .inputbar input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }

  .inputbar input:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 3px rgba(52, 152, 219, 0.3);
  }

  .inputbar button {
    padding: 8px 20px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .inputbar button:hover {
    background: #2980b9;
  }

  .inputbar button:active {
    background: #1f618d;
  }

  .browse-panel {
    display: none;
    flex: 1;
    min-height: 0;
    background: radial-gradient(circle at top, #15182c, #080b18);
    color: #daf2ff;
    padding: 14px;
    overflow: auto;
  }

  .browse-panel.active {
    display: block;
  }

  .browse-controls {
    display: grid;
    gap: 10px;
    margin-bottom: 12px;
    background: rgba(17, 23, 43, 0.9);
    border: 1px solid #41507d;
    border-radius: 4px;
    padding: 10px;
  }

  .browse-controls label {
    font-size: 12px;
    color: #9ab7ff;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .browse-controls textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    border: 1px solid #3e5aa3;
    border-radius: 3px;
    background: #070d24;
    color: #d8ecff;
    padding: 8px;
    font-family: "Courier New", monospace;
    font-size: 12px;
  }

  .browse-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .browse-btn {
    border: 1px solid #93b1ff;
    background: linear-gradient(180deg, #4262b8, #253f84);
    color: #fff;
    border-radius: 3px;
    font-size: 12px;
    font-weight: bold;
    padding: 7px 10px;
    cursor: pointer;
  }

  .browse-btn.alt {
    border-color: #bd9dff;
    background: linear-gradient(180deg, #7952c9, #56319d);
  }

  .browse-btn:disabled {
    opacity: 0.55;
    cursor: wait;
  }

  .browse-status {
    font-size: 12px;
    color: #c7d8ff;
    margin-bottom: 10px;
  }

  .room-list {
    display: grid;
    gap: 8px;
  }

  .room-card {
    background: rgba(18, 26, 48, 0.94);
    border: 1px solid #35558c;
    border-radius: 4px;
    padding: 10px;
    display: grid;
    gap: 6px;
  }

  .room-card h4 {
    margin: 0;
    font-size: 14px;
    color: #d9ecff;
  }

  .room-meta {
    font-size: 12px;
    color: #a7bfe8;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .room-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .room-actions button {
    border: 1px solid #5ba2ff;
    border-radius: 3px;
    background: #0b58a5;
    color: white;
    font-weight: bold;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .room-actions button.copy {
    border-color: #8ca5dd;
    background: #2f4473;
  }

  .room-error {
    border-left: 3px solid #e74c3c;
    background: rgba(255, 90, 90, 0.12);
    color: #ffd0d0;
    font-size: 12px;
    padding: 8px;
    border-radius: 3px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal {
    background: white;
    border-radius: 5px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 440px;
    width: 90%;
  }

  .modal h3 {
    margin-top: 0;
    color: #2c3e50;
  }

  .modal-field {
    margin-bottom: 15px;
  }

  .modal-field label {
    display: block;
    margin-bottom: 5px;
    color: #2c3e50;
    font-weight: bold;
    font-size: 12px;
  }

  .modal-field input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    margin-bottom: 5px;
  }

  .color-palette {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 8px;
  }

  .color-swatch {
    width: 100%;
    aspect-ratio: 1;
    border: 2px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }

  .color-swatch:hover {
    transform: translateY(-1px);
  }

  .color-swatch.selected {
    border-color: #2c3e50;
    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.25);
  }

  .modal-field input.invalid {
    border-color: #e74c3c;
    box-shadow: 0 0 3px rgba(231, 76, 60, 0.3);
  }

  .color-preview-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 10px 0 8px;
  }

  .color-preview {
    border: 1px solid #d6dce5;
    border-radius: 4px;
    padding: 10px;
    font-size: 12px;
    display: grid;
    gap: 6px;
  }

  .color-preview.dark {
    background: #223040;
    border-color: #223040;
    color: #d9ecff;
  }

  .color-preview.light {
    background: #f8fafc;
    color: #2c3e50;
  }

  .color-preview-name {
    font-size: 14px;
    font-weight: bold;
    color: var(--ares-username-color);
    text-shadow: 0 0 1px rgba(255,255,255,0.45), 0 0 1px rgba(0,0,0,0.35);
  }

  .modal-inline-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .modal-inline-actions small {
    color: #637289;
  }

  .modal-secondary {
    padding: 6px 10px;
    border: 1px solid #9fb4cb;
    border-radius: 3px;
    background: #f4f7fb;
    color: #2c3e50;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
  }

  .modal-secondary:hover {
    background: #e7eef7;
  }

  .modal-field input:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 3px rgba(52, 152, 219, 0.3);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .modal-actions button {
    padding: 8px 16px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .modal-actions .save {
    background: #3498db;
    color: white;
  }

  .modal-actions .save:hover {
    background: #2980b9;
  }

  .modal-actions .cancel {
    background: #ecf0f1;
    color: #2c3e50;
  }

  .modal-actions .cancel:hover {
    background: #ddd;
  }
</style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">Channels</div>
    <div id="channelList"></div>
    <div class="sidebar-header">Ares Galaxy</div>
    <div class="channel-item browse" id="browseRoomsTab">🛰 Browse Rooms</div>
    <div class="sidebar-footer">
      <button class="settings-btn" id="settingsBtn">⚙️ Settings</button>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div class="brand">
        <img src="assets/ares-logo.png" alt="Ares Galaxy logo" class="brand-logo" />
        <h2 id="channelTitle">#general</h2>
      </div>
      <div class="username" id="usernameDisplay">Guest</div>
    </div>

    <div id="chatPanel" class="chat-panel">
      <div class="chatlog" id="chatlog"></div>
      <div class="inputbar" id="chatInputBar">
        <input type="text" id="msgInput" placeholder="Say something..." autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <div class="browse-panel" id="browsePanel">
      <div class="browse-controls">
        <label for="supernodeInput">Supernodes (one host:port per line)</label>
        <textarea id="supernodeInput" placeholder="67.21.12.10:54321&#10;67.21.12.11:54321"></textarea>
        <div class="browse-actions">
          <button class="browse-btn" id="loadNodesBtn">Load SNodes.dat</button>
          <button class="browse-btn alt" id="refreshRoomsBtn">Refresh room listings</button>
        </div>
      </div>
      <div class="browse-status" id="browseStatus">Add supernodes, then refresh to fetch live room listings.</div>
      <div class="room-list" id="roomList"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>Settings</h3>
    <div class="modal-field">
      <label for="usernameInput">Username:</label>
      <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20" />
    </div>
    <div class="modal-field">
      <label for="usernameColorInput">Username Color:</label>
      <div class="color-palette" id="usernameColorPalette"></div>
      <input type="text" id="usernameColorInput" placeholder="#3498db" maxlength="7" spellcheck="false" />
      <div class="color-preview-row">
        <div class="color-preview light">
          <span>Light preview</span>
          <span class="color-preview-name" id="colorPreviewLight">Guest</span>
        </div>
        <div class="color-preview dark">
          <span>Dark preview</span>
          <span class="color-preview-name" id="colorPreviewDark">Guest</span>
        </div>
      </div>
      <div class="modal-inline-actions">
        <small>Enter a 3 or 6 digit hex code.</small>
        <button type="button" class="modal-secondary" id="resetColorBtn">Reset to Default</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="save" id="saveBtn">Save</button>
      <button class="cancel" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
  const channels = ['general', 'off-topic', 'gaming', 'music', 'tech', 'random'];
  const chatlog = document.getElementById('chatlog');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const channelTitle = document.getElementById('channelTitle');
  const channelList = document.getElementById('channelList');
  const usernameDisplay = document.getElementById('usernameDisplay');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsModal = document.getElementById('settingsModal');
  const usernameInput = document.getElementById('usernameInput');
  const usernameColorPalette = document.getElementById('usernameColorPalette');
  const usernameColorInput = document.getElementById('usernameColorInput');
  const colorPreviewLight = document.getElementById('colorPreviewLight');
  const colorPreviewDark = document.getElementById('colorPreviewDark');
  const resetColorBtn = document.getElementById('resetColorBtn');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const browseRoomsTab = document.getElementById('browseRoomsTab');
  const browsePanel = document.getElementById('browsePanel');
  const chatPanel = document.getElementById('chatPanel');
  const roomList = document.getElementById('roomList');
  const browseStatus = document.getElementById('browseStatus');
  const supernodeInput = document.getElementById('supernodeInput');
  const loadNodesBtn = document.getElementById('loadNodesBtn');
  const refreshRoomsBtn = document.getElementById('refreshRoomsBtn');

  const ROOM_CACHE_TTL_MS = 30 * 1000;
  const DEFAULT_USERNAME_COLOR = '#3498db';
  const USERNAME_COLOR_PALETTE = [
    '#3498db',
    '#5dade2',
    '#2ecc71',
    '#58d68d',
    '#f39c12',
    '#e67e22',
    '#9b59b6',
    '#8e44ad',
    '#16a085',
    '#1abc9c',
    '#7f8cfd',
    '#f5b041'
  ];

  let currentChannel = localStorage.getItem('ares_channel') || 'general';
  let username = localStorage.getItem('ares_username') || 'Guest';
  let usernameColor = normalizeHexColor(localStorage.getItem('ares_username_color')) || DEFAULT_USERNAME_COLOR;
  let pendingUsernameColor = usernameColor;
  let chatHistory = {};
  let currentView = 'channel';
  let isLoadingRooms = false;
  let discoveredRooms = [];
  let nodeErrors = [];
  const roomStateByNode = new Map();

  channels.forEach(ch => {
    const item = document.createElement('div');
    item.className = `channel-item ${ch === currentChannel ? 'active' : ''}`;
    item.textContent = '#' + ch;
    item.dataset.channel = ch;
    item.onclick = (e) => switchChannel(ch, e);
    channelList.appendChild(item);

  });

  usernameDisplay.textContent = username;
  applyUsernameColor(usernameColor);
  renderUsernameColorPalette();

  function parseNodeLine(rawLine) {
    const line = String(rawLine || '').trim();
    if (!line) return null;

    let host = '';
    let portText = '';
    if (line.startsWith('[')) {
      const end = line.lastIndexOf(']');
      if (end < 0) return null;
      host = line.slice(1, end).trim();
      if (line[end + 1] !== ':') return null;
      portText = line.slice(end + 2).trim();
    } else {
      const splitIndex = line.lastIndexOf(':');
      if (splitIndex < 0) return null;
      host = line.slice(0, splitIndex).trim();
      portText = line.slice(splitIndex + 1).trim();
    }

    const port = parseInt(portText, 10);
    if (!host || !Number.isInteger(port) || port < 1 || port > 65535) return null;
    return { host: host.trim(), port };
  }

  function getConfiguredNodes() {
    const lines = supernodeInput.value.split(/\r?\n/);
    const map = new Map();
    for (const rawLine of lines) {
      const node = parseNodeLine(rawLine);
      if (!node) continue;
      map.set(`${node.host}:${node.port}`, node);
    }
    return Array.from(map.values());
  }

  function setRoomBrowseLoading(loading) {
    isLoadingRooms = loading;
    refreshRoomsBtn.disabled = loading;
    loadNodesBtn.disabled = loading;
    refreshRoomsBtn.textContent = loading ? 'Querying supernodes…' : 'Refresh room listings';
  }

  function renderRoomCards() {
    roomList.innerHTML = '';

    if (nodeErrors.length) {
      for (const err of nodeErrors) {
        const errorEl = document.createElement('div');
        errorEl.className = 'room-error';
        errorEl.textContent = `${err.node} — ${err.error}`;
        roomList.appendChild(errorEl);
      }
    }

    if (!discoveredRooms.length) {
      if (!nodeErrors.length && !isLoadingRooms) {
        const empty = document.createElement('div');
        empty.className = 'room-error';
        empty.style.borderLeftColor = '#5ba2ff';
        empty.style.color = '#d5e5ff';
        empty.style.background = 'rgba(91, 162, 255, 0.14)';
        empty.textContent = 'No rooms discovered yet. Try different supernodes or refresh again.';
        roomList.appendChild(empty);
      }
      return;
    }

    for (const room of discoveredRooms) {
      const card = document.createElement('div');
      card.className = 'room-card';

      const title = document.createElement('h4');
      title.textContent = room.roomId;

      const meta = document.createElement('div');
      meta.className = 'room-meta';
      const users = room.userCount != null ? `${room.userCount} users` : 'users unknown';
      const desc = room.description || room.category || 'no description';
      const metaParts = [
        users,
        desc,
        `${room.host}:${room.port}`,
        room.latencyMs != null ? `${room.latencyMs}ms` : 'n/a latency'
      ];
      for (const part of metaParts) {
        const span = document.createElement('span');
        span.textContent = part;
        meta.appendChild(span);
      }

      const actions = document.createElement('div');
      actions.className = 'room-actions';
      const joinButton = document.createElement('button');
      joinButton.textContent = 'Join';
      joinButton.onclick = () => joinDiscoveredRoom(room);

      const copyButton = document.createElement('button');
      copyButton.className = 'copy';
      copyButton.textContent = 'Copy address';
      copyButton.onclick = () => copyRoomAddress(room);

      actions.appendChild(joinButton);
      actions.appendChild(copyButton);

      card.appendChild(title);
      card.appendChild(meta);
      card.appendChild(actions);
      roomList.appendChild(card);
    }
  }

  function setBrowseStatus() {
    if (isLoadingRooms) {
      browseStatus.textContent = 'Querying supernodes for live room directories...';
      return;
    }
    if (discoveredRooms.length) {
      browseStatus.textContent = `Discovered ${discoveredRooms.length} rooms. Updated ${new Date().toLocaleTimeString()}.`;
      return;
    }
    if (nodeErrors.length) {
      browseStatus.textContent = 'Some supernodes returned errors. See details below.';
      return;
    }
    browseStatus.textContent = 'Add supernodes, then refresh to fetch live room listings.';
  }

  function setView(view) {
    currentView = view;
    const isBrowse = view === 'browse';
    browseRoomsTab.classList.toggle('active', isBrowse);
    browsePanel.classList.toggle('active', isBrowse);
    chatPanel.style.display = isBrowse ? 'none' : 'flex';
    if (isBrowse) {
      channelTitle.textContent = 'Browse Rooms';
      setBrowseStatus();
      renderRoomCards();
    } else {
      channelTitle.textContent = '#' + currentChannel;
      input.focus();
    }
  }

  function ensureChannelVisible(ch) {
    if (channelList.querySelector(`[data-channel="${CSS.escape(ch)}"]`)) return;
    const item = document.createElement('div');
    item.className = 'channel-item';
    item.textContent = '#' + ch;
    item.dataset.channel = ch;
    item.onclick = (e) => switchChannel(ch, e);
    channelList.appendChild(item);
  }

  function switchChannel(ch, e) {
    if (currentView !== 'browse') {
      chatHistory[currentChannel] = chatlog.innerHTML;
    }
    currentChannel = ch;
    localStorage.setItem('ares_channel', ch);
    document.querySelectorAll('.channel-item[data-channel]').forEach(item => item.classList.remove('active'));
    if (e && e.currentTarget) e.currentTarget.classList.add('active');
    channelTitle.textContent = '#' + ch;
    if (typeof chatHistory[ch] === 'string') {
      chatlog.innerHTML = chatHistory[ch];
    } else {
      chatlog.innerHTML = '';
      addSystemMessage(`Joined #${ch}`);
      chatHistory[ch] = chatlog.innerHTML;
    }
    setView('channel');
    input.focus();
  }

  function timestamp() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function normalizeHexColor(value) {
    const raw = String(value || '').trim().replace(/^#/, '');
    if (/^[0-9a-f]{3}$/i.test(raw)) {
      return '#' + raw.split('').map((char) => char + char).join('').toLowerCase();
    }
    if (/^[0-9a-f]{6}$/i.test(raw)) {
      return '#' + raw.toLowerCase();
    }
    return '';
  }

  function applyUsernameColor(color) {
    document.documentElement.style.setProperty('--ares-username-color', color || DEFAULT_USERNAME_COLOR);
  }

  function escapeHtml(value) {
    const safeValue = document.createElement('span');
    safeValue.textContent = String(value || '');
    return safeValue.innerHTML;
  }

  function renderUsernameColorPalette() {
    usernameColorPalette.innerHTML = '';
    for (const color of USERNAME_COLOR_PALETTE) {
      const swatch = document.createElement('button');
      swatch.type = 'button';
      swatch.className = 'color-swatch';
      swatch.style.background = color;
      swatch.title = color;
      swatch.setAttribute('aria-label', `Select username color ${color}`);
      swatch.dataset.color = color;
      swatch.addEventListener('click', () => {
        pendingUsernameColor = color;
        usernameColorInput.value = color;
        usernameColorInput.classList.remove('invalid');
        syncUsernameColorPreview();
      });
      usernameColorPalette.appendChild(swatch);
    }
    syncUsernameColorPreview();
  }

  function syncUsernameColorPreview() {
    const previewName = usernameInput.value.trim() || username || 'Guest';
    const previewColor = pendingUsernameColor || DEFAULT_USERNAME_COLOR;
    colorPreviewLight.textContent = previewName;
    colorPreviewDark.textContent = previewName;
    colorPreviewLight.style.color = previewColor;
    colorPreviewDark.style.color = previewColor;
    usernameColorInput.classList.toggle('invalid', Boolean(usernameColorInput.value.trim()) && !normalizeHexColor(usernameColorInput.value));
    usernameColorPalette.querySelectorAll('.color-swatch').forEach((swatch) => {
      swatch.classList.toggle('selected', swatch.dataset.color === previewColor);
    });
  }

  function appendHighlightedText(container, text, highlightedText) {
    const safeText = String(text || '');
    const highlight = String(highlightedText || '');
    if (!highlight) {
      container.textContent = safeText;
      return;
    }

    if (!safeText.includes(highlight)) {
      container.textContent = safeText;
      return;
    }

    let cursor = 0;
    while (cursor < safeText.length) {
      const start = safeText.indexOf(highlight, cursor);
      if (start < 0) {
        container.appendChild(document.createTextNode(safeText.slice(cursor)));
        break;
      }
      if (start > cursor) {
        container.appendChild(document.createTextNode(safeText.slice(cursor, start)));
      }
      const ref = document.createElement('span');
      ref.className = 'system-user-ref';
      ref.textContent = highlight;
      container.appendChild(ref);
      cursor = start + highlight.length;
    }
  }

  function addSystemMessage(text, highlightedText = '') {
    const msg = document.createElement('div');
    msg.className = 'message system';

    const timeEl = document.createElement('span');
    timeEl.className = 'message-time';
    timeEl.textContent = timestamp();
    msg.appendChild(timeEl);

    const textEl = document.createElement('div');
    textEl.className = 'message-text';
    appendHighlightedText(textEl, text, highlightedText);
    msg.appendChild(textEl);
    chatlog.appendChild(msg);
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  function addMessage(user, text, isUpdate = false) {
    const msg = document.createElement('div');
    msg.className = isUpdate ? 'message update' : 'message';

    const timeEl = document.createElement('span');
    timeEl.className = 'message-time';
    timeEl.textContent = timestamp();
    msg.appendChild(timeEl);

    const userEl = document.createElement('span');
    userEl.className = 'message-user';
    userEl.textContent = user;
    msg.appendChild(userEl);

    const textEl = document.createElement('div');
    textEl.className = 'message-text';
    textEl.innerHTML = text;
    msg.appendChild(textEl);

    chatlog.appendChild(msg);
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  function handleSend() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(username, escapeHtml(text));
    input.value = '';
    input.focus();
  }

  function joinDiscoveredRoom(room) {
    const channelName = room.roomId.replace(/^#/, '').trim() || 'room';
    if (!chatHistory[channelName]) chatHistory[channelName] = '';
    ensureChannelVisible(channelName);
    const channelEl = channelList.querySelector(`[data-channel="${CSS.escape(channelName)}"]`);
    switchChannel(channelName, { currentTarget: channelEl });
    addMessage('System', `Joined live room #${channelName} via ${room.host}:${room.port}`, true);
  }

  async function copyRoomAddress(room) {
    const text = `${room.host}:${room.port}/${room.roomId}`;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const helper = document.createElement('textarea');
        helper.value = text;
        helper.style.position = 'fixed';
        helper.style.left = '-1000px';
        document.body.appendChild(helper);
        helper.focus();
        helper.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(helper);
        if (!copied) throw new Error('copy command rejected');
      }
      browseStatus.textContent = `Copied ${text}`;
    } catch (err) {
      browseStatus.textContent = `Copy failed: ${err.message || 'clipboard unavailable'}`;
    }
  }

  function normalizeResults(results) {
    const roomById = new Map();
    const errors = [];
    for (const result of results || []) {
      const nodeLabel = `${result.host}:${result.port}`;
      roomStateByNode.set(nodeLabel, { timestamp: Date.now(), result });
      if (!result.ok) {
        errors.push({ node: nodeLabel, error: result.error || 'unknown error' });
        continue;
      }
      for (const room of result.rooms || []) {
        const normalized = {
          host: result.host,
          port: result.port,
          latencyMs: result.latencyMs,
          roomId: room.roomId,
          userCount: room.userCount,
          description: room.description,
          category: room.category,
          fetchedAt: Date.now()
        };

        const key = String(room.roomId || '').toLowerCase();
        const existing = roomById.get(key);
        if (!existing) {
          roomById.set(key, normalized);
          continue;
        }
        const merged = {
          ...existing,
          host: existing.host || normalized.host,
          port: existing.port || normalized.port,
          latencyMs: Math.min(
            Number.isFinite(existing.latencyMs) ? existing.latencyMs : Number.POSITIVE_INFINITY,
            Number.isFinite(normalized.latencyMs) ? normalized.latencyMs : Number.POSITIVE_INFINITY
          ),
          userCount: normalized.userCount != null ? normalized.userCount : existing.userCount,
          description: existing.description || normalized.description,
          category: existing.category || normalized.category,
          fetchedAt: Math.max(existing.fetchedAt || 0, normalized.fetchedAt || 0)
        };
        if (!Number.isFinite(merged.latencyMs)) merged.latencyMs = null;
        roomById.set(key, merged);
      }
    }

    discoveredRooms = Array.from(roomById.values());
    nodeErrors = errors;
  }

  async function refreshRoomListings(forceRefresh = false) {
    if (!window.aresNet || typeof window.aresNet.queryRoomDirectory !== 'function') {
      nodeErrors = [{ node: 'local', error: 'room directory handler unavailable' }];
      discoveredRooms = [];
      setBrowseStatus();
      renderRoomCards();
      return;
    }

    const nodes = getConfiguredNodes();
    if (!nodes.length) {
      nodeErrors = [{ node: 'input', error: 'no valid host:port entries provided' }];
      discoveredRooms = [];
      setBrowseStatus();
      renderRoomCards();
      return;
    }

    const now = Date.now();
    const cachedResults = [];
    const nodesToFetch = [];

    for (const node of nodes) {
      const key = `${node.host}:${node.port}`;
      const cached = roomStateByNode.get(key);
      if (!forceRefresh && cached && now - cached.timestamp < ROOM_CACHE_TTL_MS) {
        cachedResults.push(cached.result);
      } else {
        nodesToFetch.push(node);
      }
    }

    setRoomBrowseLoading(true);
    setBrowseStatus();

    try {
      let fetchedResults = [];
      if (nodesToFetch.length) {
        const response = await window.aresNet.queryRoomDirectory(nodesToFetch, forceRefresh);
        fetchedResults = (response && response.results) || [];
      }

      normalizeResults([...cachedResults, ...fetchedResults]);
    } catch (err) {
      nodeErrors = [{ node: 'query', error: err.message || 'query failed' }];
      discoveredRooms = [];
    } finally {
      setRoomBrowseLoading(false);
      setBrowseStatus();
      renderRoomCards();
    }
  }

  browseRoomsTab.addEventListener('click', () => {
    setView('browse');
  });

  loadNodesBtn.addEventListener('click', async () => {
    if (!window.aresNet || typeof window.aresNet.loadSNodesFile !== 'function') return;
    try {
      const response = await window.aresNet.loadSNodesFile();
      if (!response || !Array.isArray(response.nodes)) {
        browseStatus.textContent = 'SNodes.dat load cancelled.';
        return;
      }
      const lines = response.nodes.map((node) => `${node.host}:${node.port}`);
      supernodeInput.value = lines.join('\n');
      browseStatus.textContent = `Loaded ${lines.length} supernodes from ${response.filePath}`;
    } catch (err) {
      browseStatus.textContent = `Failed to load SNodes.dat: ${err.message || 'unknown error'}`;
    }
  });

  refreshRoomsBtn.addEventListener('click', () => refreshRoomListings(true));

  settingsBtn.addEventListener('click', () => {
    usernameInput.value = username;
    usernameColorInput.value = usernameColor;
    pendingUsernameColor = usernameColor;
    syncUsernameColorPreview();
    settingsModal.classList.add('show');
    usernameInput.focus();
  });

  saveBtn.addEventListener('click', () => {
    const previousUsername = username;
    const newUsername = usernameInput.value.trim();
    const typedUsernameColor = usernameColorInput.value.trim();
    const normalizedTypedColor = normalizeHexColor(typedUsernameColor);
    if (typedUsernameColor && !normalizedTypedColor) {
      usernameColorInput.classList.add('invalid');
      usernameColorInput.focus();
      return;
    }
    const nextUsernameColor = normalizedTypedColor || pendingUsernameColor || DEFAULT_USERNAME_COLOR;

    usernameColor = nextUsernameColor;
    pendingUsernameColor = nextUsernameColor;
    localStorage.setItem('ares_username_color', usernameColor);
    applyUsernameColor(usernameColor);

    if (newUsername) {
      username = newUsername;
      localStorage.setItem('ares_username', username);
      usernameDisplay.textContent = username;
      addSystemMessage(`${previousUsername} changed their username`, previousUsername);
    }
    settingsModal.classList.remove('show');
  });

  cancelBtn.addEventListener('click', () => {
    settingsModal.classList.remove('show');
  });

  usernameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') saveBtn.click();
  });

  usernameInput.addEventListener('input', syncUsernameColorPreview);
  usernameColorInput.addEventListener('input', () => {
    const normalizedColor = normalizeHexColor(usernameColorInput.value);
    if (normalizedColor) {
      pendingUsernameColor = normalizedColor;
    }
    syncUsernameColorPreview();
  });
  usernameColorInput.addEventListener('blur', () => {
    const normalizedColor = normalizeHexColor(usernameColorInput.value);
    if (normalizedColor) {
      usernameColorInput.value = normalizedColor;
      pendingUsernameColor = normalizedColor;
    }
    syncUsernameColorPreview();
  });
  resetColorBtn.addEventListener('click', () => {
    pendingUsernameColor = DEFAULT_USERNAME_COLOR;
    usernameColorInput.value = DEFAULT_USERNAME_COLOR;
    usernameColorInput.classList.remove('invalid');
    syncUsernameColorPreview();
  });

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  channelTitle.textContent = '#' + currentChannel;
  if (typeof chatHistory[currentChannel] === 'string') {
    chatlog.innerHTML = chatHistory[currentChannel];
  } else {
    addSystemMessage(`Welcome to #${currentChannel}, ${username}!`, username);
  }
  input.focus();
</script>

</body>
