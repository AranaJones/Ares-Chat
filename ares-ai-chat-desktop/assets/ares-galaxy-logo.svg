<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ares Galaxy logo</title>
  <desc id="desc">Retro styled planet and wordmark for Ares Galaxy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2238"/>
      <stop offset="100%" stop-color="#0f1324"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#45d0ff"/>
      <stop offset="100%" stop-color="#1f83ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <g transform="translate(256 200)">
    <ellipse cx="0" cy="0" rx="140" ry="44" fill="none" stroke="url(#ring)" stroke-width="22" transform="rotate(-12)"/>
    <circle cx="0" cy="0" r="92" fill="url(#planet)"/>
    <circle cx="-28" cy="-24" r="16" fill="#8ef0ff" opacity="0.85"/>
    <circle cx="24" cy="14" r="9" fill="#8ef0ff" opacity="0.65"/>
  </g>

  <text x="256" y="364" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="54" letter-spacing="3" fill="#f7f9ff" font-weight="700">ARES</text>
  <text x="256" y="414" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="40" letter-spacing="6" fill="#ffd166" font-weight="700">GALAXY</text>
</svg>
