<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ares Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 10px;
    height: 100vh;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  .container {
    display: flex;
    height: 100%;
    gap: 10px;
  }

  .sidebar {
    width: 300px;
    background: #2c3e50;
    color: white;
    border-radius: 5px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 12px;
    font-weight: bold;
    border-bottom: 1px solid #34495e;
  }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
  }

  .sidebar-section {
    padding-bottom: 10px;
    border-bottom: 1px solid #34495e;
  }

  .section-label {
    padding: 10px 12px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #bdc3c7;
  }

  .channel-item {
    padding: 8px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
  }

  .channel-item:hover {
    background: #34495e;
  }

  .channel-item.active {
    background: #3498db;
    border-left-color: #fff;
    font-weight: bold;
  }

  .channel-item small {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: #d6e7f5;
    font-weight: normal;
    word-break: break-word;
  }

  .live-panel {
    padding: 12px;
    display: grid;
    gap: 8px;
  }

  .live-panel label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #bdc3c7;
  }

  .live-panel input {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #4d6478;
    border-radius: 3px;
    background: #f8fbfd;
    color: #2c3e50;
    font-size: 12px;
  }

  .live-actions,
  .footer-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .live-panel button,
  .settings-btn {
    width: 100%;
    padding: 8px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    transition: background 0.2s;
  }

  .live-panel button:hover,
  .settings-btn:hover {
    background: #2980b9;
  }

  .settings-btn.secondary,
  .live-panel button.secondary {
    background: #34495e;
  }

  .settings-btn.secondary:hover,
  .live-panel button.secondary:hover {
    background: #415b70;
  }

  .status-line {
    min-height: 32px;
    padding: 8px;
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    font-size: 12px;
    color: #ecf0f1;
    line-height: 1.35;
  }

  .status-line.error {
    background: rgba(192, 57, 43, 0.35);
  }

  .sidebar-footer {
    padding: 10px 12px;
    border-top: 1px solid #34495e;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: white;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .header {
    background: #2c3e50;
    color: white;
    padding: 12px 15px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .brand-copy {
    min-width: 0;
  }

  .brand-logo {
    width: clamp(22px, 2.2vw, 30px);
    height: clamp(22px, 2.2vw, 30px);
    max-width: 100%;
    object-fit: contain;
    flex: 0 0 auto;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }

  .header h2 {
    margin: 0;
    font-size: clamp(15px, 1.4vw, 16px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .channel-meta {
    margin-top: 4px;
    font-size: 12px;
    color: #bdc3c7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header .username {
    font-size: 12px;
    color: #bdc3c7;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .chatlog {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #fafafa;
  }

  .message {
    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 3px;
    background: white;
    border-left: 3px solid #3498db;
  }

  .message.system {
    border-left-color: #95a5a6;
    color: #7f8c8d;
    font-style: italic;
    background: #ecf0f1;
  }

  .message.update {
    border-left-color: #27ae60;
    color: #27ae60;
    background: #d5f4e6;
    font-weight: bold;
  }

  .message.private {
    border-left-color: #8e44ad;
    background: #f4ecf7;
  }

  .message-user {
    font-weight: bold;
    color: #2c3e50;
  }

  .message-time {
    font-size: 12px;
    color: #95a5a6;
    margin-right: 8px;
  }

  .message-text {
    color: #333;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .message.update .message-text {
    color: inherit;
  }

  .inputbar {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: white;
    border-top: 1px solid #ddd;
  }

  .inputbar input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }

  .inputbar input:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 3px rgba(52, 152, 219, 0.3);
  }

  .inputbar input:disabled,
  .inputbar button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .inputbar button {
    padding: 8px 20px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .inputbar button:hover:not(:disabled) {
    background: #2980b9;
  }

  .inputbar button:active:not(:disabled) {
    background: #1f618d;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal {
    background: white;
    border-radius: 5px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 400px;
    width: 90%;
  }

  .modal h3 {
    margin-top: 0;
    color: #2c3e50;
  }

  .modal-field {
    margin-bottom: 15px;
  }

  .modal-field label {
    display: block;
    margin-bottom: 5px;
    color: #2c3e50;
    font-weight: bold;
    font-size: 12px;
  }

  .modal-field input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    margin-bottom: 5px;
  }

  .modal-field input:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 3px rgba(52, 152, 219, 0.3);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .modal-actions button {
    padding: 8px 16px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .modal-actions .save {
    background: #3498db;
    color: white;
  }

  .modal-actions .save:hover {
    background: #2980b9;
  }

  .modal-actions .cancel {
    background: #ecf0f1;
    color: #2c3e50;
  }

  .modal-actions .cancel:hover {
    background: #ddd;
  }
</style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">Channels</div>
    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <div class="section-label">Live Ares</div>
        <div class="live-panel">
          <label for="supernodeInput">Supernode host:port</label>
          <input type="text" id="supernodeInput" placeholder="1.2.3.4:4661" />
          <div class="live-actions">
            <button id="connectSupernodeBtn">Login node</button>
            <button id="loadSNodesBtn" class="secondary">Load SNodes</button>
          </div>
          <button id="tryLoadedNodeBtn" class="secondary">Try loaded node list</button>
          <label for="roomFeedUrlInput">Live room feed</label>
          <input type="text" id="roomFeedUrlInput" />
          <button id="loadLiveRoomsBtn">Load live rooms</button>
          <label for="roomLinkInput">Room target</label>
          <input type="text" id="roomLinkInput" placeholder="arlnk://chatroom:host:port|room" />
          <button id="addRoomLinkBtn" class="secondary">Add target</button>
          <div class="status-line" id="liveStatus">Load a room feed or paste a room target to join a real Ares chatroom.</div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">Live rooms</div>
        <div id="liveChannelList"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">Simulated rooms</div>
        <div id="simulatedChannelList"></div>
      </div>
    </div>
    <div class="sidebar-footer footer-actions">
      <button class="settings-btn secondary" id="disconnectLiveBtn">Leave live room</button>
      <button class="settings-btn" id="settingsBtn">⚙️ Settings</button>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div class="brand">
        <img src="assets/ares-logo.png" alt="Ares Galaxy logo" class="brand-logo" />
        <div class="brand-copy">
          <h2 id="channelTitle">#general</h2>
          <div class="channel-meta" id="channelMeta">Local simulated room</div>
        </div>
      </div>
      <div class="username" id="usernameDisplay">Guest</div>
    </div>
    <div class="chatlog" id="chatlog"></div>
    <div class="inputbar">
      <input type="text" id="msgInput" placeholder="Say something..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>Settings</h3>
    <div class="modal-field">
      <label for="usernameInput">Username:</label>
      <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20" />
    </div>
    <div class="modal-actions">
      <button class="save" id="saveBtn">Save</button>
      <button class="cancel" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
  const simulatedChannels = ['general', 'off-topic', 'gaming', 'music', 'tech', 'random'];
  const chatlog = document.getElementById('chatlog');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const channelTitle = document.getElementById('channelTitle');
  const channelMeta = document.getElementById('channelMeta');
  const simulatedChannelList = document.getElementById('simulatedChannelList');
  const liveChannelList = document.getElementById('liveChannelList');
  const usernameDisplay = document.getElementById('usernameDisplay');
  const settingsBtn = document.getElementById('settingsBtn');
  const disconnectLiveBtn = document.getElementById('disconnectLiveBtn');
  const settingsModal = document.getElementById('settingsModal');
  const usernameInput = document.getElementById('usernameInput');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const liveStatus = document.getElementById('liveStatus');
  const supernodeInput = document.getElementById('supernodeInput');
  const connectSupernodeBtn = document.getElementById('connectSupernodeBtn');
  const loadSNodesBtn = document.getElementById('loadSNodesBtn');
  const tryLoadedNodeBtn = document.getElementById('tryLoadedNodeBtn');
  const roomFeedUrlInput = document.getElementById('roomFeedUrlInput');
  const loadLiveRoomsBtn = document.getElementById('loadLiveRoomsBtn');
  const roomLinkInput = document.getElementById('roomLinkInput');
  const addRoomLinkBtn = document.getElementById('addRoomLinkBtn');

  let username = localStorage.getItem('ares_username') || 'Guest';
  let loadedNodes = [];
  let liveChannels = [];
  let liveUsers = {};
  let currentChannel = parseStoredChannel();
  let activeRoomKey = null;
  let lastSupernodeSession = null;
  const chatHistory = {};

  roomFeedUrlInput.value = localStorage.getItem('ares_live_feed_url') || window.aresNet.defaults.liveChannelFeedUrl;
  supernodeInput.value = localStorage.getItem('ares_supernode_target') || '';
  usernameDisplay.textContent = username;

  function channelKey(channel) {
    if (channel.type === 'live') {
      return `live:${channel.host}:${channel.port}|${channel.name}`;
    }
    return `sim:${channel.name}`;
  }

  function parseStoredChannel() {
    try {
      const raw = localStorage.getItem('ares_channel_state');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.type && parsed.name) {
          return parsed;
        }
      }
    } catch (error) {
    }
    return { type: 'simulated', name: localStorage.getItem('ares_channel') || 'general' };
  }

  function persistCurrentChannel() {
    localStorage.setItem('ares_channel_state', JSON.stringify(currentChannel));
    if (currentChannel.type === 'simulated') {
      localStorage.setItem('ares_channel', currentChannel.name);
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function timestamp() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function messageHtml(user, text, type = 'default') {
    const extra = type === 'default' ? '' : ' ' + type;
    const userHtml = user ? `<span class="message-user">${escapeHtml(user)}</span>` : '';
    return `<div class="message${extra}"><span class="message-time">${timestamp()}</span>${userHtml}<div class="message-text">${escapeHtml(text)}</div></div>`;
  }

  function ensureHistory(channel) {
    const key = channelKey(channel);
    if (!chatHistory[key]) {
      chatHistory[key] = [];
    }
    return chatHistory[key];
  }

  function addHistory(channel, user, text, type = 'default') {
    ensureHistory(channel).push(messageHtml(user, text, type));
    if (channelKey(channel) === channelKey(currentChannel)) {
      renderCurrentHistory();
    }
  }

  function ensureWelcomeMessage(channel) {
    const history = ensureHistory(channel);
    if (history.length > 0) {
      return;
    }
    if (channel.type === 'live') {
      history.push(messageHtml('System', `Live target ready for #${channel.name} at ${channel.host}:${channel.port}. Join it from the sidebar to start the real room connection.`, 'system'));
      return;
    }
    history.push(messageHtml('System', `Welcome to #${channel.name}, ${username}!`, 'system'));
  }

  function updateChannelMeta() {
    if (currentChannel.type === 'live') {
      const roster = liveUsers[channelKey(currentChannel)];
      const rosterText = roster ? `${roster.size} user${roster.size === 1 ? '' : 's'} seen` : 'joining';
      const supernodeText = currentChannel.supernode ? ` via supernode ${currentChannel.supernode.host}:${currentChannel.supernode.port}` : '';
      const topicText = currentChannel.topic ? ` • ${currentChannel.topic}` : '';
      channelMeta.textContent = `Live Ares room ${currentChannel.host}:${currentChannel.port} • ${rosterText}${supernodeText}${topicText}`;
      return;
    }
    channelMeta.textContent = 'Local simulated room';
  }

  function renderCurrentHistory() {
    ensureWelcomeMessage(currentChannel);
    chatlog.innerHTML = ensureHistory(currentChannel).join('');
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  function updateInputState() {
    const isLive = currentChannel.type === 'live';
    input.disabled = isLive;
    sendBtn.disabled = isLive;
    input.placeholder = isLive
      ? 'Live room read-only: room login and inbound updates are real, sending is still disabled.'
      : 'Say something...';
  }

  function setLiveStatus(text, isError = false) {
    liveStatus.textContent = text;
    liveStatus.classList.toggle('error', isError);
  }

  function upsertLiveChannel(channel) {
    const key = channelKey({ type: 'live', host: channel.host, port: channel.port, name: channel.name });
    const existingIndex = liveChannels.findIndex((entry) => channelKey(entry) === key);
    const merged = {
      type: 'live',
      ...channel
    };
    if (existingIndex === -1) {
      liveChannels.push(merged);
    } else {
      liveChannels[existingIndex] = { ...liveChannels[existingIndex], ...merged };
    }
    liveChannels.sort((left, right) => (right.users || 0) - (left.users || 0) || left.name.localeCompare(right.name));
    renderChannelLists();
    return liveChannels.find((entry) => channelKey(entry) === key);
  }

  function renderChannelLists() {
    simulatedChannelList.innerHTML = '';
    liveChannelList.innerHTML = '';

    simulatedChannels.forEach((name) => {
      const channel = { type: 'simulated', name };
      const item = document.createElement('div');
      item.className = `channel-item${channelKey(channel) === channelKey(currentChannel) ? ' active' : ''}`;
      item.textContent = '#' + name;
      item.onclick = () => switchChannel(channel);
      simulatedChannelList.appendChild(item);
      ensureHistory(channel);
    });

    if (liveChannels.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'channel-item';
      empty.textContent = 'No live rooms loaded yet';
      liveChannelList.appendChild(empty);
    }

    liveChannels.forEach((channel) => {
      const item = document.createElement('div');
      item.className = `channel-item${channelKey(channel) === channelKey(currentChannel) ? ' active' : ''}`;
      item.innerHTML = `#${escapeHtml(channel.name)}<small>${escapeHtml(`${channel.host}:${channel.port}${channel.users ? ` • ${channel.users} users` : ''}`)}</small>`;
      item.onclick = () => joinLiveChannel(channel);
      liveChannelList.appendChild(item);
      ensureHistory(channel);
    });
  }

  function switchChannel(channel) {
    currentChannel = { ...channel };
    persistCurrentChannel();
    channelTitle.textContent = '#' + channel.name;
    updateChannelMeta();
    updateInputState();
    renderChannelLists();
    renderCurrentHistory();
    input.focus();
  }

  async function loginSupernode(target) {
    const session = await window.aresNet.loginSupernode(target, username);
    lastSupernodeSession = session;
    localStorage.setItem('ares_supernode_target', `${session.host}:${session.port}`);
    supernodeInput.value = `${session.host}:${session.port}`;
    setLiveStatus(`Logged into supernode ${session.host}:${session.port} using the real Ares prelogin/login handshake.`);
    return session;
  }

  async function ensureSupernodeIfPossible() {
    if (lastSupernodeSession) {
      return lastSupernodeSession;
    }
    const manualTarget = supernodeInput.value.trim();
    if (manualTarget) {
      return loginSupernode(manualTarget);
    }
    if (loadedNodes.length > 0) {
      const session = await window.aresNet.loginAnySupernode(loadedNodes, username);
      lastSupernodeSession = session;
      supernodeInput.value = `${session.host}:${session.port}`;
      localStorage.setItem('ares_supernode_target', `${session.host}:${session.port}`);
      setLiveStatus(`Logged into supernode ${session.host}:${session.port} from the loaded SNodes list.`);
      return session;
    }
    return null;
  }

  async function joinLiveChannel(channel) {
    try {
      setLiveStatus(`Joining live room #${channel.name}...`);
      let supernodeNote = 'without a verified supernode';
      try {
        const session = await ensureSupernodeIfPossible();
        if (session) {
          supernodeNote = `via supernode ${session.host}:${session.port}`;
        }
      } catch (error) {
        setLiveStatus(`Live room join will continue without supernode context: ${error.message}`);
      }

      const result = await window.aresNet.joinLiveChannel(channel, username);
      activeRoomKey = result.roomKey;
      const merged = upsertLiveChannel({
        ...channel,
        ...result.validated,
        joined: true,
        supernode: result.supernode || null
      });
      switchChannel(merged);
      addHistory(merged, 'System', `Joined real Ares room #${merged.name} at ${merged.host}:${merged.port} ${supernodeNote}. Waiting for live room traffic...`, 'system');
      if (merged.topic) {
        addHistory(merged, 'System', `Topic: ${merged.topic}`, 'system');
      }
      setLiveStatus(`Live room #${merged.name} is connected.`);
    } catch (error) {
      setLiveStatus(error.message, true);
    }
  }

  function handleLiveRoomEvent(event) {
    const room = liveChannels.find((entry) => channelKey(entry).replace('live:', '') === event.roomKey);
    const activeChannel = room || liveChannels.find((entry) => channelKey(entry).replace('live:', '') === activeRoomKey) || currentChannel;
    const key = activeChannel.type === 'live' ? channelKey(activeChannel) : null;

    if (event.type === 'status') {
      setLiveStatus(event.text);
      return;
    }

    if (event.type === 'error') {
      setLiveStatus(event.message, true);
      if (activeChannel.type === 'live') {
        addHistory(activeChannel, 'System', event.message, 'system');
      }
      return;
    }

    if (!key) {
      return;
    }

    liveUsers[key] = liveUsers[key] || new Set();

    switch (event.type) {
      case 'login-ack':
        addHistory(activeChannel, 'System', 'Room login acknowledged by the chat server.', 'system');
        break;
      case 'topic': {
        const updated = upsertLiveChannel({ ...activeChannel, topic: event.topic });
        if (channelKey(currentChannel) === channelKey(updated)) {
          currentChannel = updated;
          updateChannelMeta();
        }
        addHistory(updated, 'System', `Topic: ${event.topic}`, 'system');
        break;
      }
      case 'userlist-user':
        liveUsers[key].add(event.name);
        updateChannelMeta();
        break;
      case 'userlist-end': {
        const updated = upsertLiveChannel({ ...activeChannel, users: liveUsers[key].size || event.userCount || activeChannel.users });
        if (channelKey(currentChannel) === channelKey(updated)) {
          currentChannel = updated;
          updateChannelMeta();
        }
        addHistory(updated, 'System', `Loaded ${liveUsers[key].size} user${liveUsers[key].size === 1 ? '' : 's'} from the live room.`, 'system');
        break;
      }
      case 'join':
        liveUsers[key].add(event.name);
        addHistory(activeChannel, 'System', `${event.name} joined the room.`, 'update');
        updateChannelMeta();
        break;
      case 'part':
        liveUsers[key].delete(event.name);
        addHistory(activeChannel, 'System', `${event.name} left the room.`, 'system');
        updateChannelMeta();
        break;
      case 'public':
        addHistory(activeChannel, event.from, event.text);
        break;
      case 'emote':
        addHistory(activeChannel, event.from, event.text, 'update');
        break;
      case 'private':
        addHistory(activeChannel, event.from, event.text, 'private');
        break;
      case 'system':
        addHistory(activeChannel, 'System', event.text, 'system');
        break;
      case 'redirect':
        addHistory(activeChannel, 'System', `Server requested redirect to ${event.host}:${event.port} (${event.room}): ${event.message}`, 'system');
        break;
      case 'close':
        activeRoomKey = null;
        addHistory(activeChannel, 'System', 'Live room socket closed.', 'system');
        setLiveStatus('Live room socket closed.');
        break;
      default:
        break;
    }
  }

  function handleSend() {
    const text = input.value.trim();
    if (!text) {
      return;
    }
    addHistory(currentChannel, username, text);
    input.value = '';
    input.focus();
  }

  settingsBtn.addEventListener('click', () => {
    usernameInput.value = username;
    settingsModal.classList.add('show');
    usernameInput.focus();
  });

  disconnectLiveBtn.addEventListener('click', async () => {
    await window.aresNet.leaveLiveChannel();
    activeRoomKey = null;
    if (currentChannel.type === 'live') {
      addHistory(currentChannel, 'System', 'Closed the active live room socket.', 'system');
    }
    setLiveStatus('Closed the active live room socket.');
  });

  connectSupernodeBtn.addEventListener('click', async () => {
    try {
      if (!supernodeInput.value.trim()) {
        throw new Error('Enter a supernode host:port first.');
      }
      await loginSupernode(supernodeInput.value.trim());
    } catch (error) {
      setLiveStatus(error.message, true);
    }
  });

  loadSNodesBtn.addEventListener('click', async () => {
    try {
      const result = await window.aresNet.loadSNodesFile();
      if (!result) {
        return;
      }
      loadedNodes = result.nodes;
      setLiveStatus(`Loaded ${loadedNodes.length} supernode candidates from ${result.filePath}.`);
    } catch (error) {
      setLiveStatus(error.message, true);
    }
  });

  tryLoadedNodeBtn.addEventListener('click', async () => {
    try {
      if (loadedNodes.length === 0) {
        throw new Error('Load SNodes.dat first.');
      }
      const session = await window.aresNet.loginAnySupernode(loadedNodes, username);
      lastSupernodeSession = session;
      supernodeInput.value = `${session.host}:${session.port}`;
      localStorage.setItem('ares_supernode_target', `${session.host}:${session.port}`);
      setLiveStatus(`Logged into live supernode ${session.host}:${session.port} from SNodes.dat.`);
    } catch (error) {
      setLiveStatus(error.message, true);
    }
  });

  loadLiveRoomsBtn.addEventListener('click', async () => {
    try {
      const url = roomFeedUrlInput.value.trim() || window.aresNet.defaults.liveChannelFeedUrl;
      const result = await window.aresNet.fetchLiveChannelFeed(url);
      localStorage.setItem('ares_live_feed_url', result.url);
      for (const channel of result.channels) {
        upsertLiveChannel(channel);
      }
      renderChannelLists();
      setLiveStatus(`Loaded ${result.channels.length} live room target${result.channels.length === 1 ? '' : 's'} from ${result.url}.`);
    } catch (error) {
      setLiveStatus(error.message, true);
    }
  });

  addRoomLinkBtn.addEventListener('click', async () => {
    try {
      const parsed = await window.aresNet.parseLiveChannelTarget(roomLinkInput.value.trim());
      const room = upsertLiveChannel({ ...parsed, source: 'manual' });
      roomLinkInput.value = '';
      setLiveStatus(`Added live target #${room.name} at ${room.host}:${room.port}.`);
    } catch (error) {
      setLiveStatus(error.message, true);
    }
  });

  saveBtn.addEventListener('click', () => {
    const newUsername = usernameInput.value.trim();
    if (newUsername) {
      username = newUsername;
      localStorage.setItem('ares_username', username);
      usernameDisplay.textContent = username;
      addHistory(currentChannel, 'System', `${username} changed their username`, 'system');
    }
    settingsModal.classList.remove('show');
  });

  cancelBtn.addEventListener('click', () => {
    settingsModal.classList.remove('show');
  });

  usernameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') saveBtn.click();
  });

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  window.aresNet.onLiveRoomEvent(handleLiveRoomEvent);

  if (currentChannel.type === 'live' && currentChannel.host && currentChannel.port) {
    upsertLiveChannel(currentChannel);
  }

  renderChannelLists();
  switchChannel(currentChannel.type === 'live' ? currentChannel : { type: 'simulated', name: currentChannel.name || 'general' });
</script>

</body>
</html>
