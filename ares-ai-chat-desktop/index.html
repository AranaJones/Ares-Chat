<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ares Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 10px;
    height: 100vh;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  .container {
    display: flex;
    height: 100%;
    gap: 10px;
  }

  .sidebar {
    width: 150px;
    background: #2c3e50;
    color: white;
    border-radius: 5px;
    overflow-y: auto;
    padding: 10px 0;
  }

  .sidebar-header {
    padding: 10px;
    font-weight: bold;
    border-bottom: 1px solid #34495e;
    margin-bottom: 5px;
  }

  .channel-item {
    padding: 8px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
  }

  .channel-item:hover {
    background: #34495e;
  }

  .channel-item.active {
    background: #3498db;
    border-left-color: #fff;
    font-weight: bold;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: white;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .header {
    background: #2c3e50;
    color: white;
    padding: 15px;
    border-bottom: 1px solid #ddd;
  }

  .header h2 {
    margin: 0;
    font-size: 16px;
  }

  .chatlog {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #fafafa;
  }

  .message {
    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 3px;
    background: white;
    border-left: 3px solid #3498db;
  }

  .message.system {
    border-left-color: #95a5a6;
    color: #7f8c8d;
    font-style: italic;
    background: #ecf0f1;
  }

  .message-user {
    font-weight: bold;
    color: #2c3e50;
  }

  .message-time {
    font-size: 12px;
    color: #95a5a6;
    margin-right: 8px;
  }

  .message-text {
    color: #333;
    word-wrap: break-word;
  }

  .inputbar {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: white;
    border-top: 1px solid #ddd;
  }

  .inputbar input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }

  .inputbar input:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 3px rgba(52, 152, 219, 0.3);
  }

  .inputbar button {
    padding: 8px 20px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }

  .inputbar button:hover {
    background: #2980b9;
  }

  .inputbar button:active {
    background: #1f618d;
  }
</style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">Channels</div>
    <div id="channelList"></div>
  </div>

  <div class="main">
    <div class="header">
      <h2 id="channelTitle">#general</h2>
    </div>
    <div class="chatlog" id="chatlog"></div>
    <div class="inputbar">
      <input type="text" id="msgInput" placeholder="Say something..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  const channels = ['general', 'off-topic', 'gaming', 'music', 'tech', 'random'];
  const chatlog = document.getElementById('chatlog');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const channelTitle = document.getElementById('channelTitle');
  const channelList = document.getElementById('channelList');

  let currentChannel = localStorage.getItem('ares_channel') || 'general';
  let chatHistory = {};

  // Initialize channels
  channels.forEach(ch => {
    const item = document.createElement('div');
    item.className = `channel-item ${ch === currentChannel ? 'active' : ''}`;
    item.textContent = '#' + ch;
    item.onclick = () => switchChannel(ch);
    channelList.appendChild(item);
    
    if (!chatHistory[ch]) {
      chatHistory[ch] = [];
    }
  });

  function switchChannel(ch) {
    // Save current channel
    chatHistory[currentChannel] = chatlog.innerHTML;
    
    // Switch channel
    currentChannel = ch;
    localStorage.setItem('ares_channel', ch);
    
    // Update UI
    document.querySelectorAll('.channel-item').forEach(item => {
      item.classList.remove('active');
    });
    event.target.classList.add('active');
    
    channelTitle.textContent = '#' + ch;
    chatlog.innerHTML = chatHistory[ch] || `<div class="message system"><span class="message-text">Joined #${ch}</span></div>`;
    input.focus();
  }

  function timestamp() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(username, text) {
    const msg = document.createElement('div');
    msg.className = 'message';
    msg.innerHTML = `<span class="message-time">${timestamp()}</span><span class="message-user">${username}</span><div class="message-text">${text}</div>`;
    chatlog.appendChild(msg);
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  function handleSend() {
    const text = input.value.trim();
    if (!text) return;
    
    addMessage('You', text);
    input.value = '';
    input.focus();
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  // Initialize
  channelTitle.textContent = '#' + currentChannel;
  if (chatHistory[currentChannel]) {
    chatlog.innerHTML = chatHistory[currentChannel];
  } else {
    addMessage('System', `Welcome to #${currentChannel}!`);
  }
  input.focus();
</script>

</body>
</html>
